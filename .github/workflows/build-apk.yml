name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web & Capacitor Setup
        run: |
          # 1. 确保 www 目录存在
          mkdir -p www

          # 2. 容错拷贝：支持 index.html / index.htm / 根目录首个 html
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ -f "mark_six_calculator.html" ]; then
            cp mark_six_calculator.html www/index.html
          else
            first_html=$(ls *.html 2>/dev/null | head -n 1)
            if [ -n "$first_html" ]; then
              cp "$first_html" www/index.html
            else
              echo "Error: No HTML file found in repository root!"
              exit 1
            fi
          fi

          # 3. 初始化 npm 并安装依赖
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # 4. 生成标准配置文件（覆盖式，避免 init 报错）
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.simulator.marksix",
            "appName": "概率论与大数定律模拟器",
            "webDir": "www"
          }
          EOF

          # 5. 添加 Android 平台并同步资源
          npx cap add android || true
          npx cap sync android

      - name: Accept Android Licenses & Build APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarkSix-Simulator.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
